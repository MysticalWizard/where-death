<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="where-death">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181d"/>
      <stop offset="1" stop-color="#2b1416"/>
    </linearGradient>
  </defs>

  <rect width="16" height="16" fill="url(#bg)"/>

  <!-- 8x8 pixel skull, same as the banner -->
  <g transform="translate(4 3)">
    <g fill="#e8e3d6">
      <rect x="2" y="0" width="4" height="1"/>
      <rect x="1" y="1" width="6" height="1"/>
      <rect x="0" y="2" width="8" height="1"/>
      <rect x="0" y="3" width="1" height="2"/>
      <rect x="3" y="3" width="2" height="2"/>
      <rect x="7" y="3" width="1" height="2"/>
      <rect x="0" y="5" width="3" height="1"/>
      <rect x="5" y="5" width="3" height="1"/>
      <rect x="1" y="6" width="6" height="1"/>
      <rect x="1" y="7" width="1" height="1"/>
      <rect x="3" y="7" width="2" height="1"/>
      <rect x="6" y="7" width="1" height="1"/>
    </g>
    <g fill="#c0392b">
      <rect x="1" y="3" width="2" height="2"/>
      <rect x="5" y="3" width="2" height="2"/>
    </g>
  </g>

  <!-- the underline the clickable coordinates get in chat -->
  <rect x="3" y="12" width="10" height="1" fill="#55ffff"/>
</svg>
