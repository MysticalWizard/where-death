<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">where-death</title>
  <desc id="desc">Pixel skull beside the mod name and an example message: You died at 142, 63, -871 in the Overworld, you were dead for 1m 12s.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181d"/>
      <stop offset="1" stop-color="#2b1416"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <g transform="translate(56 -20)">

  <!-- 8x8 pixel skull, 16px per pixel -->
  <g fill="#e8e3d6" transform="translate(88 96)">
    <rect x="32" y="0" width="64" height="16"/>
    <rect x="16" y="16" width="96" height="16"/>
    <rect x="0" y="32" width="128" height="16"/>
    <rect x="0" y="48" width="16" height="32"/>
    <rect x="48" y="48" width="32" height="32"/>
    <rect x="112" y="48" width="16" height="32"/>
    <rect x="0" y="80" width="48" height="16"/>
    <rect x="80" y="80" width="48" height="16"/>
    <rect x="16" y="96" width="96" height="16"/>
    <rect x="16" y="112" width="16" height="16"/>
    <rect x="48" y="112" width="32" height="16"/>
    <rect x="96" y="112" width="16" height="16"/>
  </g>
  <g fill="#c0392b" transform="translate(88 96)">
    <rect x="16" y="48" width="32" height="32"/>
    <rect x="80" y="48" width="32" height="32"/>
  </g>

  <text x="264" y="148" fill="#ffffff" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700">where-death</text>
  <text x="268" y="194" fill="#a7adb7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30">Tells you where you died.</text>

  <!-- the chat line the mod actually sends, in Minecraft chat colours -->
  <rect x="252" y="222" width="828" height="44" fill="#000000" fill-opacity="0.45"/>
  <text x="266" y="251" font-family="Consolas, 'DejaVu Sans Mono', Menlo, monospace" font-size="20" fill="#aaaaaa">
    <tspan fill="#ff5555">&#9760; </tspan><tspan>You died at </tspan><tspan fill="#55ffff" text-decoration="underline">142, 63, -871</tspan><tspan> in the Overworld &#8212; you were dead for 1m 12s.</tspan>
  </text>
  </g>
</svg>
